# Docker Compose override for Mac/Dev testing
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  collector:
    volumes:
      # Override: use mock files instead of /var/log/audit on the host
      - ./dev-mock/audit.log:/host-logs/audit.log:ro
      - ./dev-mock/auth.log:/host-logs/auth.log:ro
      - /etc/passwd:/host-etc/passwd:ro   # Mac has this file
      - auditvisual-data:/data


  api:
    volumes:
      - ./api:/app
      - ./data:/data
      - ./collector:/app/collector_src:ro
    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - JWT_SECRET=dev-secret-key-not-for-production-use
      - JWT_EXPIRE_HOURS=8
